[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leela"
dynamic = ["version"]
description = "creative workspace that starts with coding"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# Everything leela imports, and nothing it does not: a transitive is not a contract.
dependencies = [
    "ramabana[cli]==0.2.75",
    "shalya>=0.1.19",
    "gheasy>=0.0.14",
    "fastcore>=1.7.0",
    "kavacha>=0.0.10",
    "kunda>=0.0.5",
    "pullup>=0.0.11",
    "exhash>=0.4.10",
    "fossick>=0.1.20",
    "ipykernel>=7.3.0",
    "ipymini>=0.0.1",
    "jupyter-client>=8.9.1",
    "koshas>=0.1.14",
    "litesearch>=0.1.54",
    "mdhtml>=0.1.38",
    "rgapi>=0.1.22",
    "python-fasthtml>=0.14.9",
    "starlette>=1.6.0",
    "uvicorn>=0.30.0",
    "httpx2>=2.10.0",
    "numpy>=1.26",
    "rapidfuzz>=3.0",
    "orjson>=3.9",
    "packaging>=24.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "dhrishti>=0.1.9",
    "watchfiles>=1.0",
    "vishalakshi>=0.1.33",
    "rahasya>=0.0.4",
    "varga>=0.0.7",
    "lekhaka>=0.0.4",
    "pyright>=1.1.400",
    "dockeasy>=0.0.10",
    "vpseasy>=0.0.24",
    "cfeasy>=0.0.6",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "jupygate>=0.0.1",
    "jupyasyncclient>=0.2.1,<0.2.8",   # 0.2.8+ returns a bare async generator where GatewayKernel reads `.reply`: every cell 500s
    "jupywire>=0.1.1",
    "dhrona>=0.1.18",
]

[project.optional-dependencies]
ipymini = []
local = ["rishi[mlx,llama]==0.1.55"]
desktop = ["kavacha[window]>=0.0.10"]
macapp = ["leela[desktop]", "kavacha[macapp]>=0.0.10"]
windows = ["leela[desktop]", "kavacha[windows]>=0.0.10"]

[project.urls]
Repository = "https://github.com/vedicreader/leela"

[project.scripts]
leela = "leela.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["leela"]
exclude = ["leela/static/js", "leela/blocks/*/*.js"]   # the modules the committed bundle is built from

[tool.hatch.build.targets.sdist]
include = ["/leela", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "leela/__init__.py"

[dependency-groups]
dev = [
    "fastaistyle>=0.0.17",
    "fastship>=0.1.2",
    "leela[local]",
    "rishi[all]==0.1.55",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.5.0",
    "nbformat>=5.10.0",
    "playwright>=1.40",
    "pandas>=2.0",
    "rishi==0.1.55",
    "pywebview>=5.3",
    "pillow>=10.0",
    "setuptools>=68.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -n auto --dist loadgroup"
timeout = 300
markers = ["slow: drives a browser, starts a kernel, or loads a model", "no_claude: runs as a machine without Claude Code, so `_claude_on_path` steps aside"]

[tool.uv]
# mcp 2 renamed FastMCP, which ramabana.mcp imports; pyjwt below 2.15.0 has the HS/RS key-confusion bypass
constraint-dependencies = ["mcp<2", "pyjwt>=2.15.0"]

[tool.uv.sources]
# PyPI, not sibling checkouts: the app bundle installs from this lock, and an editable path breaks it
leela = { workspace = true }