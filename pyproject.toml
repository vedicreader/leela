[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leela"
dynamic = ["version"]
description = "creative workspace that starts with coding"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# Everything leela imports, and nothing it does not: a transitive is not a contract.
dependencies = [
    # Not `ramabana[all]`: since 0.2.5 that is `[cli]` plus `[serve]` (mcp, agent-client-protocol) and
    # `[dhrona]`. Leela imports neither server, and names `dhrona` itself. `[all]` no longer carries
    # `rishi[all]`; the local-model backends (mlx, cv2, transformers, scipy, about 400MB) are
    # `leela[local]` below, and the settings pane installs them on demand.
    # `[cli]` is `[search]` (fossick, koshas, litesearch, rgapi, vishalakshi) and `[python]` (dhrishti,
    # jupyter-client, rich), plus pyghostty, teleprint and fastpylight. `workspace._attachment_context`
    # imports the media helpers, which since ramabana 0.2.9 live in `ramabana.tools`, not the terminal.
    # Pinned, not floored: the next ramabana and the next rishi both land behaviour Leela has to
    # change for, and a floor would take them on the next sync without a word. Raise these
    # deliberately, with the Leela side of the change in the same commit.
    "ramabana[cli]==0.2.47",   # 0.2.x: Agent(warm=, optin=), git through the git tools, shalya 0.1.x tool set; 0.2.3 profiles; 0.2.4 sub-agents see pictures, generate_image(path=) is a gated write; 0.2.5 cloud routing defaults (Opus turn, gpt-4.1 small jobs, Sonnet sub-agents), no local route unless named; 0.2.6 sub-agents never get root-only tools; 0.2.7 resume_session(keep_model=), a resumed history survives set_model, uraiyadal 0.0.9 tool-call parsing; 0.2.8 git per repository, restart_kernel, sub-agent steps/timeout/nesting; 0.2.9 tool results carry pictures, attachments without the terminal; 0.2.10 the index reads only what the log grew by; 0.2.11 claude-haiku-5-5, the Claude Code picker discovers what an Anthropic key lists; 0.2.12 no keyword routing or preflight, a briefing for current models, Claude at high effort with a 1M window, sonnet/haiku track 5-5, warm start opt-in, uraiyadal 0.0.11 batches independent calls; 0.2.13 library output stays off the TUI, the pane keeps the model's notes; 0.2.14 one note per message; 0.2.15 background rows open in the pane; 0.2.16 sub-agents report back (step floor, budget notice, rishi 0.1.41 reads Claude's invoke dialect); 0.2.17 a lost terminal exits cleanly, background commands log instead of opening panes; 0.2.18 steer with attachments, enter steers the queued line; 0.2.19 model tiers (haiku small jobs, gpt-6.1-luna medium), sub-agents write behind approvals; 0.2.20 no local model unless chosen; 0.2.31 `hl.diff_html`, the diff views' colours; 0.2.35 rishi 0.1.43, a Claude reply stops at its first tool call; 0.2.36 shalya 0.1.12; 0.2.37 rishi's public `get_model`; 0.2.38 `ramabana.learned`, the learned review queue; 0.2.39 accept refuses an AGENTS.md past 2,000 characters, `learned_command`; 0.2.40 `learned.compact`; 0.2.44 `ContextFull`, `[image]` in history, `learned.set_enabled`; 0.2.45 an oversized message goes out as an excerpt kept in a file, `Agent(fresh_hint=)`, learning in `~/.config/ramabana/config.toml`; 0.2.46 Azure OpenAI, config.toml model definitions, `sync_models`, `use_aliases`, `remote_models`; 0.2.47 no provider chosen for you, `PROVIDERS`, `needs_setup`, `setup_guide`, the image job
    # The toolset and the git plumbing are their own packages now, and Leela names them itself
    # rather than reaching through `ramabana.tools` and `ramabana.git` for what they hold. The
    # re-export seams stay for a release; a second package's spelling of the same object is not
    # a dependency worth keeping.
    "shalya>=0.1.15",   # image_tools(route=); git_commit(path=), restart_kernel, BrowserHost, Media results; 0.1.10 Host.read_guard; 0.1.11 cmd_stop reports stopped, inspect_python copies; 0.1.12 fuse, post_responses, describe, mod_skill public; 0.1.14 what ramabana 0.2.38 needs
    "gheasy>=0.0.13",  # 0.0.10 opened the six helpers; 0.0.12 org repos in the org; `blocks/git/seam.py` still takes either
    "fastcore>=1.7.0",
    # The three packages Leela's own code was lifted into. `kavacha` is a base dependency and not
    # a desktop extra: `blocks/keys/menus.py` takes the menu vocabulary from it, and its spec,
    # bundle and probe halves need nothing but fastcore. `kunda` is the kernels and the interpreter
    # discovery; `pullup` the project, the release pipeline, the deploys and the workflows.
    "kavacha>=0.0.7",   # 0.0.6 OpenHandler, RecentTarget, hidden_windows, keyed_windows, dock_delegates public; 0.0.7 ShellApi.set_background, run_shell(background=)
    "kunda>=0.0.4",   # 0.0.3 a stopped loop holds no pool slot (canvas runtime); 0.0.4 InspectorClient, give_up_after, venv_roots, runtime_python, frozen_pythonpath, kernel_spec public
    "pullup>=0.0.9",   # 0.0.7 nbdev_job runs nbdev-test and nbdev-clean; 0.0.9 public `gheasy_core`
    "exhash>=0.4.10",
    "fossick>=0.1.19",   # caches JSON, not pickle: GHSA-w8v5-vhqr-4h9v has no fixed release; 0.1.18 url2nb works again; 0.1.19 debug_ready public
    "ipykernel>=7.3.0",        # launched, not imported: leela's own venv is a kernel target
    "ipymini>=0.0.1",
    "jupyter-client>=8.9.1",
    "koshas>=0.1.11",
    "litesearch>=0.1.49",   # 0.1.49 `get_index` and `usearch_sql` no longer wait on the `db_lock` `_Serial` holds (0.1.47 and 0.1.48 deadlocked agent code search); 0.1.48 numpy when usearch does not import (macOS 14); 0.1.46 add_dir(stop=); 0.1.45 no parse pool for HTML; 0.1.44 dir2files skip settings; 0.1.43 onnxruntime 1.31 model loading, pre('***'); rank_fts, correct, fts_or, fts_phrases, fts_vocab, roman_fold(doubles=); onnx, onnxruntime and flashrank are extras, on both rerank paths
    "mdhtml>=0.1.38",   # `md2dom(...).to_html()`, which `blocks/canvas/lit.py` renders through
    # The ripgrep flags and its event stream, in one place rather than a command line built here.
    # `koshas` and `fossick` both bring it; Leela calls it directly, so Leela names it.
    "rgapi>=0.1.22",
    "python-fasthtml>=0.14.9",
    "starlette>=1.6.0",        # 1.6.0 excludes text/event-stream from GZip; below it every stream buffers
    "uvicorn>=0.30.0",
    "httpx2>=2.10.0",
    "numpy>=1.26",
    # rapidfuzz backs the quick-open ranker (`core.text._fuzzy_score`), orjson the .ipynb parse in
    # `blocks/nb`. Both are import-guarded with a stdlib fallback, so a partial install still runs.
    "rapidfuzz>=3.0",
    "orjson>=3.9",
    "packaging>=24.0",
    # `workspace._attachment_context` imports `ramabana.cli` for the media helpers, and that
    # module imports rich, which ramabana declares nowhere. Ours to name while that is true.
    "rich>=13.0",
    "pyyaml>=6.0",
    "dhrishti>=0.1.6",
    "watchfiles>=1.0",
    "vishalakshi>=0.1.31",   # 0.1.31 stop and progress on add_file, pdf and gh_file, and a stop inside a batch; 0.1.30 stop and progress on add_files, add_tree and the acquire paths; 0.1.28 public litesearch and rahasya names; 0.1.27 MCP results gated; 0.1.26 titles, headings and sources under the send rule; ask policy local-else-redact; note(key=); age/stale rows; 0.1.22 levels, send_check; 0.1.23 progress, boxes, crop; 0.1.24 edit_change, revert_page, undo_decision, reset_pii
    "rahasya>=0.0.4",   # 0.0.4 findings past MAX_SCAN at their real offset
    "varga>=0.0.7",
    "lekhaka>=0.0.4",
    # Was `[lsp]`, `[github]` and `[gateway]`. Leela's own code reaches all three -- the rename and
    # hover paths, the pull request a branch belongs to, the workflow editor, and the kernels the
    # gateway serves -- so they are dependencies. The guards below them stay: they still have a
    # partial install and a capped version to report.
    "pyright>=1.1.400",
    "dockeasy>=0.0.10",   # 0.0.10 public `FASTOPS_ENV`
    "vpseasy>=0.0.24",   # 0.0.22 a failed rsync stops the deploy; 0.0.24 what pullup 0.0.9 needs
    "cfeasy>=0.0.6",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "jupygate>=0.0.1",
    # Capped, not excluded: 0.2.8 made something the gateway `async for`s a coroutine, and by
    # 0.2.14 `run` is a bare async generator where `GatewayKernel` wants the `Run` it reads
    # `.reply` off. An unpinned resolve took the latter and every cell came back 500.
    "jupyasyncclient>=0.2.1,<0.2.8",
    "jupywire>=0.1.1",
    # Warm starts, assess, capture and accept in the agent pane (`blocks/agent/warm.py`). 0.1.4 is
    # the first with `fit_rounds` reporting skips, `Finding.turn`, `install_round` returning its
    # path, and floors that leave the stack below alone.
    "dhrona>=0.1.13",   # 0.1.13 a folded-in candidate keeps its id; 0.1.12 compact_learned(onto=); 0.1.11 what `ramabana.learned.compact` needs; 0.1.10 the version ramabana 0.2.38 is built against; 0.1.9 cut-off runs no longer count as good, resolved start.json paths, BatchBusy
]

[project.optional-dependencies]
ipymini = [] # compatibility extra; ipymini now ships with Leela
# On-device inference. Kept out of the default install and out of the desktop bundle because it is
# the heaviest thing Leela can depend on; `RUNTIME_EXTRAS` installs one of these from the settings
# pane, pinned to the rishi the bundle was frozen with.
# `litert` is not an extra any more: rishi 0.1.32 took litert-lm-api on as a base
# dependency, so naming it here would install nothing and warn.
local = ["rishi[mlx,llama]==0.1.46"]
# The native window and the two freezers, through kavacha, which installs each platform's own
# bindings and nothing else. `pillow` arrives with `kavacha[icons]`, which both build extras carry.
desktop = ["kavacha[window]>=0.0.7"]
macapp = ["leela[desktop]", "kavacha[macapp]>=0.0.7"]
windows = ["leela[desktop]", "kavacha[windows]>=0.0.7"]

[project.urls]
Repository = "https://github.com/vedicreader/leela"

[project.scripts]
leela = "leela.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["leela"]
exclude = ["leela/static/js", "leela/blocks/*/*.js"]   # the modules the committed bundle is built from

[tool.hatch.build.targets.sdist]
include = ["/leela", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "leela/__init__.py"

[dependency-groups]
dev = [
    "fastaistyle>=0.0.17",
    "fastship>=0.1.2",     # Leela's own release pipeline; a project's `ship-*` runs in its venv
    "leela[local]",
    "leela-bricks",   # the canvas example bricks; tests resolve every embed against it
    "rishi[all]==0.1.46",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.5.0",
    "nbformat>=5.10.0",
    "playwright>=1.40",
    "pandas>=2.0",
    "rishi==0.1.46",
    "pywebview>=5.3",
    "pillow>=10.0",
    "setuptools>=68.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `loadgroup` is `load` plus one rule: tests marked `xdist_group` stay on one worker. Modules whose
# fixtures are module-scoped and expensive declare a group rather than being rebuilt per worker.
addopts = "-m 'not slow' -n auto --dist loadgroup"
# A hung kernel, browser or approval fails by name rather than stalling the run (pytest-timeout).
timeout = 300
markers = ["slow: drives a browser, starts a kernel, or loads a model", "no_claude: runs as a machine without Claude Code, so `_claude_on_path` steps aside"]

[tool.uv]
# Leela imports no `mcp`; `koshas` brings it and asks only for `>=1.2.0`. 2.x renamed `FastMCP`
# to `MCPServer`, which `ramabana.mcp` imports, so an unconstrained resolve takes the major and
# `import ramabana.mcp` stops working. A constraint rather than a dependency: it is not ours.
# `pyjwt` arrives through `mcp[crypto]`. Below 2.15.0 it carries the asymmetric-PEM HS/RS confusion
# bypass and the other Dependabot alerts against this lock.
constraint-dependencies = ["mcp<2", "pyjwt>=2.15.0"]

[tool.uv.sources]
leela = { workspace = true }
leela-bricks = { path = "extensions/bricks", editable = true }
# The six packages Leela's own code was lifted into are taken from PyPI, not from the checkouts
# beside this one. `setup_app.lock_requirements` exports this lock as the app's requirements, and
# an editable path there builds a bundle that depends on directories only this machine has.
# Add `name = { path = "../name", editable = true }` back while working across two of them.