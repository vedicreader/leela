[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leela"
dynamic = ["version"]
description = "creative workspace that starts with coding"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# Everything leela imports, and nothing it does not: a transitive is not a contract.
dependencies = [
    # Not `ramabana[all]`: that extra carries `rishi[all]`, whose three local-model backends bring
    # mlx, cv2, transformers and scipy -- about 400MB into a bundle, for a runtime most people
    # never select. They are `leela[local]` below, and the settings pane installs them on demand.
    # The rest of `[all]` is ramabana's own CLI (pyghostty, teleprint) and mcp, none of which Leela
    # imports; `dhrishti` and `jupyter-client` it depends on directly and are still here.
    # `[cli]` because `workspace._attachment_context` imports `ramabana.cli` for the media
    # helpers, and that module needs pyghostty and teleprint. 0.9MB, and the alternative is
    # media handling that cannot be reached without a terminal UI.
    # Pinned, not floored: the next ramabana and the next rishi both land behaviour Leela has to
    # change for, and a floor would take them on the next sync without a word. Raise these
    # deliberately, with the Leela side of the change in the same commit.
    "ramabana[cli]==0.1.32",   # the release that carries the shalya/gheasy split
    # The toolset and the git plumbing are their own packages now, and Leela names them itself
    # rather than reaching through `ramabana.tools` and `ramabana.git` for what they hold. The
    # re-export seams stay for a release; a second package's spelling of the same object is not
    # a dependency worth keeping.
    "shalya>=0.0.5",   # 0.0.5 gives each tool its own summary
    "gheasy>=0.0.9",
    "fastcore>=1.7.0",
    "exhash>=0.4.10",
    "fossick>=0.1.17",   # caches JSON, not pickle: GHSA-w8v5-vhqr-4h9v has no fixed release
    "ipykernel>=7.3.0",        # launched, not imported: leela's own venv is a kernel target
    "ipymini>=0.0.1",
    "jupyter-client>=8.9.1",
    "koshas>=0.1.7",
    "litesearch>=0.1.34",   # onnx, onnxruntime and flashrank are extras, on both rerank paths
    "mdhtml>=0.1.21",
    "python-fasthtml>=0.14.9",
    "starlette>=1.6.0",        # 1.6.0 excludes text/event-stream from GZip; below it every stream buffers
    "uvicorn>=0.30.0",
    "httpx2>=2.10.0",
    "numpy>=1.26",
    "packaging>=24.0",
    "ptymini>=0.0.5",   # the pty layer: one ring per session, replayed on attach
    # `workspace._attachment_context` imports `ramabana.cli` for the media helpers, and that
    # module imports rich, which ramabana declares nowhere. Ours to name while that is true.
    "rich>=13.0",
    "pyyaml>=6.0",
    "dhrishti>=0.1.3",
    "watchfiles>=1.0",
    "vishalakshi>=0.1.14",   # 0.1.14 is the retrieval PII gate, and `mark_pii` beside `mark_not_pii`
]

[project.optional-dependencies]
ipymini = [] # compatibility extra; ipymini now ships with Leela
lsp = ["pyright>=1.1.400"]
github = [
    "gheasy>=0.0.9",
    "dockeasy>=0.0.5",
    "vpseasy>=0.0.18",
    "cfeasy>=0.0.4",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
]
gateway = [
    "jupygate>=0.0.1",
    # 0.2.8 made something the gateway does `async for` over a coroutine, so a kernel there
    # executes nothing: "'async for' requires an object with __aiter__". Capped until fixed.
    "jupyasyncclient>=0.2.1,!=0.2.8",
    "jupywire>=0.1.1",
]
# On-device inference. Kept out of the default install and out of the desktop bundle because it is
# the heaviest thing Leela can depend on; `RUNTIME_EXTRAS` installs one of these from the settings
# pane, pinned to the rishi the bundle was frozen with.
# `litert` is not an extra any more: rishi 0.1.32 took litert-lm-api on as a base
# dependency, so naming it here would install nothing and warn.
local = ["rishi[mlx,llama]==0.1.36"]
all = ["leela[github,gateway,lsp,local]"]
desktop = [
    "pywebview>=5.3",
    "pyobjc-framework-Cocoa>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.1; sys_platform == 'darwin'",
    "pythonnet>=3.0.3; sys_platform == 'win32'",
]
macapp = ["leela[desktop]", "py2app>=0.28.8; sys_platform == 'darwin'", "pillow>=10.0"]
windows = ["leela[desktop]", "py2exe>=0.14.2; sys_platform == 'win32'", "pillow>=10.0"]

[project.urls]
Repository = "https://github.com/vedicreader/leela"

[project.scripts]
leela = "leela.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["leela"]
exclude = ["leela/static/js", "leela/blocks/*/*.js"]   # the modules the committed bundle is built from

[tool.hatch.build.targets.sdist]
include = ["/leela", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "leela/__init__.py"

[dependency-groups]
dev = [
    "fastaistyle>=0.0.17",
    "fastship>=0.1.2",     # Leela's own release pipeline; a project's `ship-*` runs in its venv
    "leela[all]",
    "rishi[all]==0.1.36",
    {include-group = "test"},
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "nbformat>=5.10.0",
    "playwright>=1.40",
    "pandas>=2.0",
    "rishi==0.1.36",
    "pywebview>=5.3",
    "pillow>=10.0",
    "setuptools>=68.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: drives a browser, starts a kernel, or loads a model"]

[tool.uv]
# Leela imports no `mcp`; `koshas` brings it and asks only for `>=1.2.0`. 2.x renamed `FastMCP`
# to `MCPServer`, which `ramabana.mcp` imports, so an unconstrained resolve takes the major and
# `import ramabana.mcp` stops working. A constraint rather than a dependency: it is not ours.
constraint-dependencies = ["mcp<2"]

[tool.uv.sources]
leela = { workspace = true }