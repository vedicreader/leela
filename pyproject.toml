[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leela"
dynamic = ["version"]
description = "creative workspace that starts with coding"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# Everything leela imports, and nothing it does not: a transitive is not a contract.
dependencies = [
    "ramabana[all]>=0.1.11",   # 0.1.11 takes `subagent_writes`
    "fastcore>=1.7.0",
    "exhash>=0.4.10",
    "fossick>=0.1.11",
    "ipykernel>=7.3.0",        # launched, not imported: leela's own venv is a kernel target
    "ipymini>=0.0.1",
    "jupyter-client>=8.9.1",
    "koshas>=0.1.0",
    "litesearch>=0.1.27",
    "mdhtml>=0.1.21",
    "python-fasthtml>=0.14.9",
    "starlette>=1.6.0",        # 1.6.0 excludes text/event-stream from GZip; below it every stream buffers
    "uvicorn>=0.30.0",
    "httpx2>=2.10.0",
    "numpy>=1.26",
    "packaging>=24.0",
    "pyyaml>=6.0",
    "dhrishti>=0.1.2",
    "watchfiles>=1.0",
    "vishalakshi>=0.1.8",
]

[project.optional-dependencies]
ipymini = [] # compatibility extra; ipymini now ships with Leela
lsp = ["pyright>=1.1.400"]
github = [
    "gheasy>=0.0.6",
    "dockeasy>=0.0.5",
    "vpseasy>=0.0.18",
    "cfeasy>=0.0.4",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
]
gateway = [
    "jupygate>=0.0.1",
    "jupyasyncclient>=0.2.1",
    "jupywire>=0.1.1",
]
all = ["leela[github,gateway,lsp]"]
desktop = [
    "pywebview>=5.3",
    "pyobjc-framework-Cocoa>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.1; sys_platform == 'darwin'",
    "pythonnet>=3.0.3; sys_platform == 'win32'",
]
macapp = ["leela[desktop]", "py2app>=0.28.8; sys_platform == 'darwin'", "pillow>=10.0"]
windows = ["leela[desktop]", "py2exe>=0.14.2; sys_platform == 'win32'", "pillow>=10.0"]

[project.urls]
Repository = "https://github.com/vedicreader/leela"

[project.scripts]
leela = "leela.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["leela"]
exclude = ["leela/static/js"]

[tool.hatch.build.targets.sdist]
include = ["/leela", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "leela/__init__.py"

[dependency-groups]
dev = [
    "fastaistyle>=0.0.17",
    "leela[all]",
    {include-group = "test"},
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "nbformat>=5.10.0",
    "playwright>=1.40",
    "pandas>=2.0",
    "rishi>=0.1.7",
    "pywebview>=5.3",
    "pillow>=10.0",
    "setuptools>=68.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: drives a browser, starts a kernel, or loads a model"]

[tool.uv.sources]
leela = { workspace = true }
ramabana = { path = "../ramabana", editable = true }
dhrishti = { path = "../dhrishti", editable = true }