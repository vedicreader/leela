[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leela-bricks"
version = "0.0.1"
description = "Components a canvas document can embed: ports, emits, and the wiring each one ships"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["fastcore>=1.7", "python-fasthtml>=0.14.0"]

# What Leela reads to find this library. `leela/blocks/canvas/bricks.py` calls
# `entry_points(group='leela.bricks')`, and the value is the module holding the registry.
[project.entry-points."leela.bricks"]
leela_bricks = "leela_bricks"

[tool.hatch.build.targets.wheel]
packages = ["leela_bricks"]
