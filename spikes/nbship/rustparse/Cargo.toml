[package]
name = "nbship-parse"
version = "0.1.0"
edition = "2021"
description = "Read Rust source, say what a PyO3 binding could be written for."

[[bin]]
name = "nbship-parse"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "parsing", "printing"] }
quote = "1"
# `span-locations` is what puts a line number on a parse error.
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"

[profile.release]
opt-level = 1
debug = 0
