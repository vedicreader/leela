## Tests for leela.
#
# leela is plain Python, so this is an ordinary pytest run -- no nbdev step. The suite
# covers the notebook document, the diff engine, the keymap, and browser routes;
# the kernel layer is faked in `tests/conftest.py` rather than
# launching real ipykernels.
name: test

on: [workflow_dispatch, pull_request, push]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: install
        run: uv pip install --system -e . --group dev
      - name: test
        run: pytest tests -q
