## Tests for leela.
#
# leela is plain Python, so this is an ordinary pytest run -- no nbdev step. The suite
# covers the notebook document, the diff engine, the keymap, and browser routes;
# the kernel layer is faked in `tests/conftest.py` rather than
# launching real ipykernels.
name: test

on: [workflow_dispatch, pull_request, push]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      # Into uv's own environment, not `--system`: the runner's `/usr` is externally managed and
      # refuses the install outright (PEP 668), which is where every run since 2 September died.
      - name: install
        run: uv sync --group dev --python 3.12
      - name: test
        run: uv run pytest tests -q
