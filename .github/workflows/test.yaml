## Tests for leela.
#
# leela is plain Python, so this is an ordinary pytest run -- no nbdev step. The suite
# covers the notebook document, the diff engine, the keymap, and browser routes;
# the kernel layer is faked in `tests/conftest.py` rather than
# launching real ipykernels.
name: test

on: [workflow_dispatch, pull_request, push]

jobs:
  pytest:
    # macOS runs the fast suite plus what Linux skips by platform: the Cocoa shell and Apple Events.
    # macos-15, not 14: numkong 7.5+ (usearch, so every vault) links `___sme_memset`, which macOS 14 lacks.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    # A hung kernel or socket fails by the clock rather than holding the runner for six hours.
    timeout-minutes: 45
    steps:
      # Full history: the literate-page test diffs from the first commit, which a shallow clone makes HEAD.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      # Into uv's own environment, not `--system`: the runner's `/usr` is externally managed and
      # refuses the install outright (PEP 668), which is where every run since 2 September died.
      - name: install
        run: uv sync --group dev --python 3.12
      # The git tests commit in temporary repositories, and a runner has no identity of its own.
      - name: git identity
        run: |
          git config --global user.name leela-ci
          git config --global user.email leela-ci@users.noreply.github.com
      - name: test
        run: uv run pytest tests -q
