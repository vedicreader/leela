## Tests for leela.
#
# leela is plain Python, so this is an ordinary pytest run -- no nbdev step. The suite
# covers the notebook document, the diff engine, the keymap, and SVG snapshots of the
# terminal frontend; the kernel layer is faked in `tests/conftest.py` rather than
# launching real ipykernels.
name: test

on: [workflow_dispatch, pull_request, push]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: install
        run: uv pip install --system -e . --group test
      - name: test
        run: pytest tests -q
      - name: upload the snapshot report
        # The report is how you see *what* a snapshot test disagreed about; without it a
        # failure here is just "the bytes differ", which is not something anyone can act on.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-report
          path: snapshot_report.html
          if-no-files-found: ignore
