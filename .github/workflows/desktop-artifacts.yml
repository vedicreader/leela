## The macOS DMG and the zipped Windows folder.
##
## Both build on their own OS, because py2app and py2exe copy the running interpreter's own
## runtime into the bundle -- there is no cross-compilation to be had. The macOS job uses
## `actions/setup-python`, whose macOS builds are framework builds, so `setup_app.py` finds
## nothing to rebuild and goes straight to py2app.
##
## Signing is opt-in: set the LEELA_CODESIGN_IDENTITY secret to a Developer ID and import the
## certificate in a step of your own. Notarization credentials stay out of this repository.
name: desktop-artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# `contents: write` is what attaches the DMG and the zip to the release the tag names, which is
# the release `ship-release` pushed the tag for.
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gateway,macapp]" pytest
      # Signing and notarising are opt-in on the secrets being set: with none of them the build
      # still produces a launchable, linker-signed app, which is what a fork gets.
      - name: import the signing certificate
        if: env.CERT != ''
        env:
          CERT: ${{ secrets.LEELA_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.LEELA_CERT_PASSWORD }}
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          printf %s "$CERT" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm -f /tmp/cert.p12
      - name: build
        env:
          LEELA_CODESIGN_IDENTITY: ${{ secrets.LEELA_CODESIGN_IDENTITY }}
          LEELA_APPLE_ID: ${{ secrets.LEELA_APPLE_ID }}
          LEELA_APPLE_PASSWORD: ${{ secrets.LEELA_APPLE_PASSWORD }}
          LEELA_TEAM_ID: ${{ secrets.LEELA_TEAM_ID }}
        run: python tools/build_release.py
      # `-m ""`: the launch test is marked slow, and the default addopts would skip the one
      # check that a py2app bundle actually starts rather than merely building.
      - name: smoke
        run: python -m pytest tests/test_packaging.py -q -m ""
      - uses: actions/upload-artifact@v4
        with:
          name: Leela-macOS
          path: dist/Leela-macOS.dmg
          if-no-files-found: error
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_release.py upload ${{ github.ref_name }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gateway,windows]" pytest
      - name: build
        run: python tools/build_release.py
      - name: smoke
        run: python -m pytest tests/test_packaging.py -q -m ""
      - uses: actions/upload-artifact@v4
        with:
          name: Leela-Windows
          path: dist/Leela-Windows.zip
          if-no-files-found: error
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_release.py upload ${{ github.ref_name }}
