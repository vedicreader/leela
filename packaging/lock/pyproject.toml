[project]
name = "leela-lock"
version = "0"
requires-python = "==3.13.*"
dependencies = ["leela==1.0.0"]

[project.optional-dependencies]
mlx = ["mlx-lm==0.32.2"]
llama = ["llama-cpp-python==0.3.30", "numpy==2.5.4", "soundfile==0.14.0"]
